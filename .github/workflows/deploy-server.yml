name: Deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to deploy (blank = this commit). Use an old SHA to roll back.
        required: false
      hotpatch:
        description: Don't restart; a staff member runs /hotpatch afterwards
        type: boolean
        default: false

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ inputs.ref || github.sha }}
    steps:
      - name: Deploy on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          MODE: ${{ inputs.hotpatch && ' hotpatch' || '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes showdown@"$HOST" "$SHA$MODE"
      - name: Rebuild the client from this server commit
        env:
          GH_TOKEN: ${{ secrets.CLIENT_DISPATCH_TOKEN }}
        run: |
          gh api repos/Grennpixel4/Dystoria-Showdown-Client/dispatches \
            -f event_type=server-updated \
            -f "client_payload[server_sha]=$SHA"
