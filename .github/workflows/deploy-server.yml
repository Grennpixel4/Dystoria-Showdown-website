name: Deploy server

on:
  # Every push to main tries to deploy right away, but only if no battles are running.
  push:
    branches: [main]
  # Fallback: if a push was skipped because of battles, retry overnight (3:00-6:30am CST).
  schedule:
    - cron: '0,30 9-12 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to deploy (blank = latest main). Use an old SHA to roll back.
        required: false
      hotpatch:
        description: Don't restart; a staff member runs /hotpatch afterwards
        type: boolean
        default: false
      wait_for_idle:
        description: Skip the restart if battles are in progress
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.compare.outputs.sha }}
    steps:
      - name: Compare the VPS with the target commit
        id: compare
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          TARGET: ${{ inputs.ref || github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          running=$(ssh -o BatchMode=yes showdown@"$HOST" status)
          echo "server is running: $running"
          echo "target commit:     $TARGET"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$running" = "$TARGET" ]; then
            echo "Nothing new to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - name: Deploy on the VPS
        id: ssh
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          MODE: ${{ inputs.hotpatch && ' hotpatch' || ((github.event_name != 'workflow_dispatch' || inputs.wait_for_idle) && ' whenidle' || '') }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          set +e
          ssh -o BatchMode=yes showdown@"$HOST" "$SHA$MODE"
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "Battles are in progress, nothing deployed. The overnight run (or the next push) will try again."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Mark this commit as live
        if: steps.ssh.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .sha)
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/live" -f sha="$full" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/live -f sha="$full"
      - name: Rebuild the client from this server commit
        if: steps.ssh.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLIENT_DISPATCH_TOKEN }}
        run: |
          gh api repos/Grennpixel4/Dystoria-Showdown-Client/dispatches \
            -f event_type=server-updated \
            -f "client_payload[server_sha]=$SHA"
